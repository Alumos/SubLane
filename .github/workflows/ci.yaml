name: CI

# Merged commits were already tested on their pull request, and release tags rerun the full
# suite through workflow_call before anything is published.
on:
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-dev
      release:
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR runs need no runner time; release and push runs stay independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    # Independent checks run in parallel; every part shares the same pinned toolchain setup.
    name: Validation (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [lint, scripts, frontend, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install changelog generator
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: git-cliff@2.14.2
      - run: make setup
      - name: Check generated code and lint
        if: matrix.part == 'lint'
        run: make generate-check lint
      - name: Test maintenance scripts
        if: matrix.part == 'scripts'
        run: node --test scripts/*.test.mjs
        env:
          SUBLANE_TEST_CHANGELOG: "1"
      - name: Test frontend
        if: matrix.part == 'frontend'
        run: pnpm --dir web test
      - name: Build production binary
        if: matrix.part == 'build'
        run: make build
      - name: Verify key migration with encrypted credentials
        if: matrix.part == 'build'
        run: SUBLANE_TEST_MIGRATION_BINARY="$PWD/bin/sublane" node --test --test-name-pattern='real CLI' scripts/separate-key.test.mjs
      - name: Validate workflow and shell scripts
        if: matrix.part == 'lint'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/*.sh
      - name: Validate Compose configurations
        if: matrix.part == 'lint'
        run: |
          docker compose -f docker.compose.yaml config --quiet
          docker compose -f docker.compose.yaml -f docker.compose.build.yaml config --quiet

  go-tests:
    name: Go race (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [gateway-server-1, gateway-server-2, gateway-server-3, gateway-server-4, gateway-server-5, other-1, other-2, other-3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with race detector
        shell: bash
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          # Shards partition by test name and package; each final shard is a complement so
          # examples, fuzz seeds, future test names and new packages are always tested.
          heavy_a='/internal/(allocations|accounts)$'
          heavy_b='/internal/(backup|auth|alerts)$'
          case "$TEST_GROUP" in
            gateway-server-1) go test -race -timeout=20m -run '^Test[A-B]' ./internal/gateway ./internal/server ;;
            gateway-server-2) go test -race -timeout=20m -run '^Test[C-G]' ./internal/gateway ./internal/server ;;
            gateway-server-3) go test -race -timeout=20m -run '^Test[H-N]' ./internal/gateway ./internal/server ;;
            gateway-server-4) go test -race -timeout=20m -run '^Test[O-R]' ./internal/gateway ./internal/server ;;
            gateway-server-5) go test -race -timeout=20m -skip '^Test[A-R]' ./internal/gateway ./internal/server ;;
            other-1|other-2|other-3)
              all=$(go list ./... | grep -vE '/internal/(gateway|server)$')
              case "$TEST_GROUP" in
                other-1) package_list=$(grep -E "$heavy_a" <<< "$all") ;;
                other-2) package_list=$(grep -E "$heavy_b" <<< "$all") ;;
                other-3) package_list=$(grep -vE "$heavy_a|$heavy_b" <<< "$all") ;;
              esac
              mapfile -t packages <<< "$package_list"
              go test -race -timeout=20m "${packages[@]}"
              ;;
            *) echo "unknown test group: $TEST_GROUP" >&2; exit 1 ;;
          esac

  containers:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILD_VERSION: ${{ inputs.version || '0.1.0-dev' }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for the native runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: sublane:ci-${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
          # The tested image is transported through docker save/load before publication.
          provenance: false
      - name: Test runtime, persistence and maintenance commands
        run: bash scripts/container-smoke.sh "sublane:ci-$ARCH" "$BUILD_VERSION"
      - name: Package and verify the tested binary
        run: |
          mkdir -p release-assets extracted
          container=$(docker create "sublane:ci-$ARCH")
          trap 'docker rm --volumes "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/sublane" extracted/sublane
          bash scripts/package.sh "$BUILD_VERSION" "$ARCH" extracted/sublane release-assets
          mkdir unpacked
          tar -xzf "release-assets/sublane_${BUILD_VERSION}_linux_${ARCH}.tar.gz" -C unpacked
          test "$(unpacked/sublane --version)" = "$BUILD_VERSION"
          test -s unpacked/LICENSE
          test -s unpacked/THIRD_PARTY_NOTICES.md
          test -s unpacked/docker.compose.yaml
          test -s unpacked/docs/README.md
      - name: Export the tested image for publication
        if: inputs.release
        run: docker save "sublane:ci-$ARCH" | gzip -1 > "release-assets/image-$ARCH.tar.gz"
      - name: Save release artifacts
        if: inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          # Re-running all jobs uses the same workflow run and artifact names.
          overwrite: true
          retention-days: 7

  # Keep the existing required check name and fail if any parallel job fails or is skipped.
  check:
    if: always()
    needs: [validation, go-tests, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          GO_TESTS_RESULT: ${{ needs.go-tests.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$GO_TESTS_RESULT" = success
          test "$CONTAINERS_RESULT" = success
