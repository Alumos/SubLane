name: CI

# Merged commits were already tested on their pull request. A release tag whose source tree is
# byte-identical to a passing pull request tree reuses those results (see "Record the verified
# tree"); any other tag reruns the full suite through workflow_call before anything is published.
on:
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-dev
      release:
        type: boolean
        default: false
      verified:
        description: The source tree already passed every validation and test job on a pull request.
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR runs need no runner time; release and push runs stay independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    # Independent checks run in parallel; every part shares the same pinned toolchain setup.
    name: Validation (${{ matrix.part }})
    if: ${{ !inputs.verified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [lint, scripts, frontend, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Build outputs are keyed by source, so each commit restores the closest earlier build and
      # recompiles only what changed. Only the build part saves, so the cache holds a full build.
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install changelog generator
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: git-cliff@2.14.2
      - run: make setup
      - name: Check generated code and lint
        if: matrix.part == 'lint'
        run: make generate-check lint
      - name: Test maintenance scripts
        if: matrix.part == 'scripts'
        run: node --test scripts/*.test.mjs
        env:
          SUBLANE_TEST_CHANGELOG: "1"
      - name: Test frontend
        if: matrix.part == 'frontend'
        run: pnpm --dir web test
      - name: Build production binary
        if: matrix.part == 'build'
        run: make build
      - name: Verify key migration with encrypted credentials
        if: matrix.part == 'build'
        run: SUBLANE_TEST_MIGRATION_BINARY="$PWD/bin/sublane" node --test --test-name-pattern='real CLI' scripts/separate-key.test.mjs
      - name: Save Go build cache
        if: matrix.part == 'build' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Validate workflow and shell scripts
        if: matrix.part == 'lint'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/*.sh
      - name: Validate Compose configurations
        if: matrix.part == 'lint'
        run: |
          docker compose -f docker.compose.yaml config --quiet
          docker compose -f docker.compose.yaml -f docker.compose.build.yaml config --quiet

  go-tests:
    name: Go race (${{ matrix.shard }})
    if: ${{ !inputs.verified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Gateway and server run in separate shards balanced by measured race-test time. Each
        # package's last shard skips the earlier patterns, so new or renamed tests always run.
        include:
          - {shard: gateway-1, packages: ./internal/gateway, run: '^Test[AB]'}
          - {shard: gateway-2, packages: ./internal/gateway, run: '^TestC'}
          - {shard: gateway-3, packages: ./internal/gateway, run: '^Test[D-G]'}
          - {shard: gateway-4, packages: ./internal/gateway, run: '^Test[H-N]'}
          - {shard: gateway-5, packages: ./internal/gateway, run: '^Test[O-Q]'}
          - {shard: gateway-6, packages: ./internal/gateway, run: '^TestR'}
          - {shard: gateway-7, packages: ./internal/gateway, skip: '^Test[A-R]'}
          - {shard: server-1, packages: ./internal/server, run: '^Test([AB]|[O-R])'}
          - {shard: server-2, packages: ./internal/server, run: '^Test[C-G]'}
          - {shard: server-3, packages: ./internal/server, run: '^Test[H-N]'}
          - {shard: server-4, packages: ./internal/server, skip: '^Test[A-R]'}
          - {shard: other-1, other: allocations}
          - {shard: other-2, other: backup-auth-alerts}
          - {shard: other-3, other: rest}
          - {shard: other-4, other: accounts}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Race-instrumented objects differ from normal builds, so they keep their own cache. The main
      # branch warms it after each merge (cache.yaml); pull requests only restore it.
      - name: Restore Go race build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-
      - name: Test with race detector
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
          OTHER: ${{ matrix.other }}
        run: |
          if [ -n "$PACKAGES" ]; then
            args=()
            if [ -n "$RUN" ]; then args+=(-run "$RUN"); fi
            if [ -n "$SKIP" ]; then args+=(-skip "$SKIP"); fi
            go test -race -timeout=20m "${args[@]}" "$PACKAGES"
            exit
          fi
          # The rest shard is a complement, so new packages are always tested.
          heavy_a='/internal/allocations$'
          heavy_b='/internal/(backup|auth|alerts)$'
          heavy_c='/internal/accounts$'
          all=$(go list ./... | grep -vE '/internal/(gateway|server)$')
          case "$OTHER" in
            allocations) package_list=$(grep -E "$heavy_a" <<< "$all") ;;
            backup-auth-alerts) package_list=$(grep -E "$heavy_b" <<< "$all") ;;
            accounts) package_list=$(grep -E "$heavy_c" <<< "$all") ;;
            rest) package_list=$(grep -vE "$heavy_a|$heavy_b|$heavy_c" <<< "$all") ;;
            *) echo "unknown package group: $OTHER" >&2; exit 1 ;;
          esac
          mapfile -t packages <<< "$package_list"
          go test -race -timeout=20m "${packages[@]}"

  containers:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILD_VERSION: ${{ inputs.version || '0.1.0-dev' }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      # Layer caching cannot keep RUN --mount=type=cache directories, so every image recompiled Go
      # from scratch. Only the Go build cache matters on a code change (module and pnpm downloads
      # are cached layers). Pull request and tag caches are invisible to other refs, so this job
      # only reads what the main-branch warmer (cache.yaml) saved and never extracts or writes back.
      - name: Restore the Go build mount
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buildkit-mounts
          key: buildkit-go-build-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            buildkit-go-build-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-
            buildkit-go-build-${{ matrix.arch }}-
      - name: Inject the Go build mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {"buildkit-mounts/go-build": "/root/.cache/go-build"}
          skip-extraction: true
      - name: Build image for the native runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: sublane:ci-${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          # Layers come from the main-branch warmer; exporting them here would only fill this ref's scope.
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          # The tested image is transported through docker save/load before publication.
          provenance: false
      - name: Test runtime, persistence and maintenance commands
        run: bash scripts/container-smoke.sh "sublane:ci-$ARCH" "$BUILD_VERSION"
      - name: Package and verify the tested binary
        run: |
          mkdir -p release-assets extracted
          container=$(docker create "sublane:ci-$ARCH")
          trap 'docker rm --volumes "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/sublane" extracted/sublane
          bash scripts/package.sh "$BUILD_VERSION" "$ARCH" extracted/sublane release-assets
          mkdir unpacked
          tar -xzf "release-assets/sublane_${BUILD_VERSION}_linux_${ARCH}.tar.gz" -C unpacked
          test "$(unpacked/sublane --version)" = "$BUILD_VERSION"
          test -s unpacked/LICENSE
          test -s unpacked/THIRD_PARTY_NOTICES.md
          test -s unpacked/docker.compose.yaml
          test -s unpacked/docs/README.md
      - name: Export the tested image for publication
        if: inputs.release
        run: docker save "sublane:ci-$ARCH" | gzip -1 > "release-assets/image-$ARCH.tar.gz"
      - name: Save release artifacts
        if: inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          # Re-running all jobs uses the same workflow run and artifact names.
          overwrite: true
          retention-days: 7

  # Keep the existing required check name and fail if any parallel job fails or is skipped.
  check:
    if: always()
    needs: [validation, go-tests, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          GO_TESTS_RESULT: ${{ needs.go-tests.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          VERIFIED: ${{ inputs.verified }}
        run: |
          test "$CONTAINERS_RESULT" = success
          if [ "$VERIFIED" = true ]; then
            # Reused results: the release run builds and smoke-tests its own versioned images only.
            test "$VALIDATION_RESULT" = skipped
            test "$GO_TESTS_RESULT" = skipped
          else
            test "$VALIDATION_RESULT" = success
            test "$GO_TESTS_RESULT" = success
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      # Every job in this run tested the same merge commit. Its tree hash names the artifact, so a
      # release tag with an identical tree (same code, scripts and workflows) can reuse these results.
      - name: Record the verified tree
        id: tree
        if: github.event_name == 'pull_request'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir verified
          printf '%s\n' "$tree" > verified/tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: verified/tree
          retention-days: 14
          overwrite: true
